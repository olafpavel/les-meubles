name: EAS Update (Expo Go preview)

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    name: Publier update Expo Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: app-mobile
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialiser projet EAS
        working-directory: app-mobile
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Configurer expo-updates
        working-directory: app-mobile
        run: eas update:configure --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publier update
        id: update
        working-directory: app-mobile
        run: |
          OUTPUT=$(eas update \
            --branch preview \
            --message "Preview $(date +%Y-%m-%d)" \
            --non-interactive \
            --json 2>&1) || true
          echo "$OUTPUT"
          PROJECT_ID=$(node -e "const a=require('./app.json'); console.log(a.expo?.extra?.eas?.projectId||'')" 2>/dev/null || echo "")
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "update_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" | head -30 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commenter la PR avec QR code
        uses: actions/github-script@v7
        with:
          script: |
            const projectId = `${{ steps.update.outputs.project_id }}`;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.data[0];
            if (!pr) return;

            let body;
            if (projectId) {
              const qrUrl = 'https://qr.expo.dev/eas-update?slug=les-meubles&projectId=' + projectId + '&groupId=preview&host=u.expo.dev';
              const deeplink = 'exp://u.expo.dev/' + projectId + '?channel-name=preview';
              body = '## Tester sur Expo Go\n\n'
                + '**1.** Installe [Expo Go](https://expo.dev/go) sur ton Android\n\n'
                + '**2.** Ouvre Expo Go et appuie sur **"Scan QR code"**\n\n'
                + '**3.** Scanne ce QR :\n\n'
                + '![QR Code](' + qrUrl + ')\n\n'
                + 'Ou ouvre ce lien dans Expo Go :\n'
                + '`' + deeplink + '`';
            } else {
              const logsUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
              body = '## EAS Update — diagnostic\n\n'
                + '```\n${{ steps.update.outputs.update_output }}\n```\n\n'
                + '[Voir les logs](' + logsUrl + ')';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
