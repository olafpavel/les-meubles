name: EAS Preview Build (Android APK)

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile

    steps:
      - name: Vérifier EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN n'est pas configuré."
            echo "::error::Va sur https://github.com/olafpavel/les-meubles/settings/secrets/actions"
            echo "::error::et ajoute un secret EXPO_TOKEN avec ta clé depuis https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Initialiser le projet EAS (première fois)
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Lancer le build APK (sans attendre)
        id: build
        run: |
          OUTPUT=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json 2>/dev/null || \
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait 2>&1)
          echo "$OUTPUT"
          BUILD_URL=$(echo "$OUTPUT" | grep -oP 'https://expo\.dev/[^\s]+' | head -1 || echo "")
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Commenter la PR avec le lien du build
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.build.outputs.build_url }}';
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.data.find(p => p.head.ref === context.ref.replace('refs/heads/', '')) || prs.data[0];
            if (!pr) return;

            const body = buildUrl
              ? `## 🔨 Build Android lancé\n\nSuis l'avancement et télécharge l'APK ici :\n👉 ${buildUrl}\n\nUne fois terminé, installe l'APK sur ton Android (active "Sources inconnues" si demandé).`
              : `## 🔨 Build Android lancé sur EAS\n\nVa sur [expo.dev/builds](https://expo.dev/builds) pour suivre l'avancement et télécharger l'APK.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
