name: EAS Preview Build (Android APK)

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (preview)
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK URL
        id: apk
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('artifacts',{}).get('buildUrl',''))" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment APK link on latest PR
        if: steps.apk.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.apk.outputs.url }}';
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main'
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: `## APK Android prêt\n\n[Télécharger l'APK](${url})\n\nInstalle-le sur ton téléphone Android (active "Sources inconnues" dans les paramètres).`
              });
            }
