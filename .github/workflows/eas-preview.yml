name: EAS Preview Build (Android APK)

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier EXPO_TOKEN
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::EXPO_TOKEN manquant — ajoute-le dans Settings > Secrets > Actions"
            exit 1
          fi
          echo "EXPO_TOKEN présent ✓"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: app-mobile
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vérifier l'authentification Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Initialiser / lier le projet EAS
        working-directory: app-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --non-interactive --force || true
          cat app.json | grep -o '"projectId":[^,}]*' || echo "(pas encore de projectId)"

      - name: Lancer le build APK
        id: build
        working-directory: app-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OUTPUT=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait 2>&1)
          echo "$OUTPUT"
          BUILD_URL=$(echo "$OUTPUT" | grep -oP 'https://expo\.dev/[^\s]+' | head -1 || echo "")
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Commenter la PR avec le lien du build
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.build.outputs.build_url }}';
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.data[0];
            if (!pr) return;
            const body = buildUrl
              ? `## Build Android lancé\n\nSuis l'avancement et télécharge l'APK ici :\n${buildUrl}\n\nInstalle l'APK sur ton Android (active "Sources inconnues" si demandé).`
              : `## Build Android lancé sur EAS\n\nVa sur [expo.dev/builds](https://expo.dev/builds) pour suivre et télécharger l'APK.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
