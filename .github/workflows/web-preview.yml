name: Web Preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  deploy:
    name: Build & Deploy web preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: app-mobile
        run: npm ci --legacy-peer-deps

      - name: Build web
        working-directory: app-mobile
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app-mobile/dist
          destination_dir: preview

      - name: Commenter la PR avec le lien de preview
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://olafpavel.github.io/les-meubles/preview`;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.data[0];
            if (!pr) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## Aperçu web disponible\n\nOuvre ce lien sur ton téléphone Android (dans Chrome) :\n\n**${url}**\n\n> Note : l'app tourne dans le navigateur. Pour la version APK native, configure EAS séparément.`,
            });
