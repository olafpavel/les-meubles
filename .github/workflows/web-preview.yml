name: Web Preview (GitHub Pages)

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app-mobile/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  deploy:
    name: Build & Deploy web preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Installer les dépendances
        working-directory: app-mobile
        run: npm ci --legacy-peer-deps

      - name: Build web
        working-directory: app-mobile
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Injecter error handler dans index.html
        working-directory: app-mobile
        run: |
          python3 - <<'PY'
          import re
          with open("dist/index.html", "r") as f:
              html = f.read()
          handler = """<script>
          window.__errors=[];
          window.onerror=function(m,s,l,c,e){
            window.__errors.push(m+(e?'\\n'+e.stack:''));
            var d=document.getElementById('root');
            if(d){d.style.cssText='padding:20px;font-family:monospace;font-size:13px;color:#c00;background:#fff;';
            d.innerHTML='<b>Erreur de démarrage :</b><pre style="white-space:pre-wrap">'+window.__errors.join('\\n\\n')+'</pre>';}
          };
          window.addEventListener('unhandledrejection',function(e){
            window.onerror('UnhandledRejection: '+e.reason,null,null,null,e.reason);
          });
          </script>"""
          html = html.replace("<div id=\"root\"></div>", handler + "\n  <div id=\"root\"></div>")
          with open("dist/index.html", "w") as f:
              f.write(html)
          PY

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app-mobile/dist

      - name: Commenter la PR avec le lien de preview
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://olafpavel.github.io/les-meubles`;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.data[0];
            if (!pr) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## Aperçu web disponible\n\nOuvre ce lien sur ton téléphone Android (dans Chrome) :\n\n**${url}**\n\nL'app tourne dans le navigateur — Discovery, détail annonce, réservation, profil.`,
            });
